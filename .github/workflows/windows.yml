name: Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release job publishes the zip; everything else is read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamp counts commits: "build N (hash)" - a shallow clone
          # would stamp "build 1" for every run.
          fetch-depth: 0

      # The image ships LLVM (clang-cl) and Ninja; this only rescues a future
      # image that drops one of them.
      - name: Install build tools (if missing)
        shell: powershell
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      # INCLUDE / LIB / PATH for the Windows SDK and the MSVC parts clang-cl
      # and lld-link pick up (rc.exe of the launcher target, kernel32.lib &c).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same recipe as build.ps1 (clang-cl + Ninja, Release); the third-party
      # dependencies FetchContent-clone from GitHub at pinned tags
      # (cmake/Dependencies.cmake), so no LunarG SDK and no pre-cloned deps
      # folder are needed. The game data is NOT required to build.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build --parallel

      - name: List the produced binaries
        shell: powershell
        run: Get-ChildItem build/bin | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: opentdu2-windows
          path: build/bin/
          if-no-files-found: error

  release:
    # A tag push (v1.2 ...) publishes build/bin as the release's .zip asset -
    # exactly what the launcher's packaged-build update path downloads
    # (launcher_updater.cpp: the first .zip asset of a release).
    if: startsWith( github.ref, 'refs/tags/v' )
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the built binaries
        uses: actions/download-artifact@v4
        with:
          name: opentdu2-windows
          path: bin

      - name: Zip
        run: |
          cd bin
          zip -r "../opentdu2-windows-${{ github.ref_name }}.zip" .
          cd ..

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: opentdu2-windows-${{ github.ref_name }}.zip
          generate_release_notes: true

  release-main:
    # Every push to main publishes an auto-tagged prerelease
    # (v0.2.<run number>): the launcher's update check compares release tag
    # names as plain strings (launcher_updater.cpp FillFromGitHub), so each
    # build gets its own tag - a reused tag would never be seen as new - and
    # its one-click update always finds the newest integrated build. The
    # v* tag releases above stay the stable channel.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the built binaries
        uses: actions/download-artifact@v4
        with:
          name: opentdu2-windows
          path: bin

      - name: Zip
        run: |
          cd bin
          zip -r "opentdu2-windows-v0.2.${{ github.run_number }}.zip" .
          cd ..

      - name: Publish the auto release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: opentdu2-windows-v0.2.${{ github.run_number }}.zip
          generate_release_notes: true
          body: Automatic build of main (build ${{ github.run_number }}). The launcher's "Download this release" applies it one-click.

      - name: Prune old auto releases
        # Keep the newest 3 auto builds; older ones only clutter the list the
        # launcher reads (the first non-draft release wins).
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq \
            '.[] | select(.isPrerelease) | .tagName' | tail -n +4 | while read -r tag; do
              case "$tag" in v0.2.*)
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag ;; esac
            done
        env:
          GH_TOKEN: ${{ github.token }}
