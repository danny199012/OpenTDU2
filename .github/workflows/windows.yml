name: Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release job publishes the zip; everything else is read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # StampBuildInfo.cmake bakes it into build_info.h (OTDU_RELEASE_TAG /
      # OTDU_RELEASE_STRING) and the launcher's version resource follows it: a
      # tag push stamps its own tag, a main push stamps the prerelease tag the
      # release-main job below is about to publish. PR builds carry no tag.
      OTDU_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || ( github.event_name == 'push' && format( 'v0.2.{0}', github.run_number ) || '' ) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamp counts commits: "build N (hash)" - a shallow clone
          # would stamp "build 1" for every run.
          fetch-depth: 0

      # The image ships LLVM (clang-cl) and Ninja; this only rescues a future
      # image that drops one of them.
      - name: Install build tools (if missing)
        shell: powershell
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      # INCLUDE / LIB / PATH for the Windows SDK and the MSVC parts clang-cl
      # and lld-link pick up (rc.exe of the launcher target, kernel32.lib &c).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same recipe as build.ps1 (clang-cl + Ninja, Release); the third-party
      # dependencies FetchContent-clone from GitHub at pinned tags
      # (cmake/Dependencies.cmake), so no LunarG SDK and no pre-cloned deps
      # folder are needed. The game data is NOT required to build.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build --parallel

      - name: List the produced binaries
        shell: powershell
        run: Get-ChildItem build/bin | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: opentdu2-windows
          path: build/bin/
          if-no-files-found: error

  android:
    # The arm64 phone build of the same commit (android/, Gradle -> CMake -> libopentdu2.so): every push
    # produces opentdu2-android-b<N>.apk next to the Windows binaries, N = the commit count the engine
    # stamps as "build N" (the launcher's Updates page reads the number after "-b"). Debug-signed.
    runs-on: ubuntu-latest
    env:
      OTDU_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || ( github.event_name == 'push' && format( 'v0.2.{0}', github.run_number ) || '' ) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The pieces android/app/build.gradle.kts pins (NDK, the SDK CMake the Gradle CMake step wants).
      - name: Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.31.1" "platforms;android-36"

      # gradle.properties pins the Windows Studio JDK; the command line wins over it. local.properties
      # (sdk.dir) is gitignored: ANDROID_HOME carries the SDK here. The CMake dependencies FetchContent-clone
      # (C:/otdu2-deps does not exist on the runner, which the dependency macro treats as "no cache").
      - name: Build the APK
        working-directory: android
        run: bash ./gradlew --console=plain assembleDebug "-Dorg.gradle.java.home=$JAVA_HOME"

      - name: Stage the APK
        run: |
          BUILD="$(git rev-list --count HEAD)"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/opentdu2-android-b${BUILD}.apk"
          ls -l out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: opentdu2-android
          path: out/
          if-no-files-found: error

  release:
    # A tag push (v1.2 ...) publishes build/bin as the release's .zip asset -
    # exactly what the launcher's packaged-build update path downloads
    # (launcher_updater.cpp: the first .zip asset of a release).
    if: startsWith( github.ref, 'refs/tags/v' )
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release body is the changelog: the commit subjects since the
          # previous release tag (the launcher shows the same list through the
          # compare API; the release page carries it for everyone else).
          fetch-depth: 0

      - name: Download the built binaries
        uses: actions/download-artifact@v4
        with:
          name: opentdu2-windows
          path: bin

      - name: Zip
        run: |
          cd bin
          zip -r "../opentdu2-windows-${{ github.ref_name }}.zip" .
          cd ..

      - name: Collect the changelog since the previous release
        id: changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            BODY="$(git log --format='* %s' "${PREV}..${GITHUB_REF_NAME}" | head -n 50)"
          else
            BODY="First release."
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: opentdu2-windows-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}

  release-main:
    # Every push to main publishes an auto-tagged prerelease
    # (v0.2.<run number>): each build gets its own tag and target_commitish,
    # which the launcher matches against its own build hash
    # (launcher_updater.cpp FillFromGitHub) to decide "is this release newer
    # than me". The v* tag releases above stay the stable channel.
    # An APK is attached when the android job succeeded; a failed phone build never blocks the Windows release.
    if: ${{ always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: [ build, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The body is the changelog: the commit subjects since the newest tag
          # this push built on (normally the previous auto prerelease).
          fetch-depth: 0

      - name: Download the built binaries
        uses: actions/download-artifact@v4
        with:
          name: opentdu2-windows
          path: bin

      - name: Download the APK (if the phone build passed)
        if: ${{ needs.android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: opentdu2-android
          path: apk

      - name: Zip
        run: |
          cd bin
          zip -r "../opentdu2-windows-v0.2.${{ github.run_number }}.zip" .
          cd ..

      - name: Collect the changelog since the last tag
        id: changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            BODY="$(git log --format='* %s' "${PREV}..HEAD" | head -n 50)"
          else
            BODY="First build."
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the auto release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            opentdu2-windows-v0.2.${{ github.run_number }}.zip
            apk/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            Automatic build of main (CI run #${{ github.run_number }}). The launcher's "Download this release" applies it one-click.

            ${{ steps.changelog.outputs.body }}

      - name: Prune old auto releases
        # Keep the newest 3 auto builds; older ones only clutter the list the
        # launcher reads (the first non-draft release wins).
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq \
            '.[] | select(.isPrerelease) | .tagName' | tail -n +4 | while read -r tag; do
              case "$tag" in v0.2.*)
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag ;; esac
            done
        env:
          GH_TOKEN: ${{ github.token }}
